language: en-US

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "services/**/src/**"
      instructions: |
        Prioritize real bugs and security risks over style.
        Check authentication and authorization, payment correctness,
        service boundaries, HTTP contracts, Kafka delivery and idempotency,
        Redis consistency, database ownership, error handling, logging, and tests.

    - path: "docker-compose.yml"
      instructions: |
        Check service names, ports, health dependencies, internal URLs,
        database isolation, safe defaults, and accidental secret exposure.

    - path: ".github/**"
      instructions: |
        Check workflow permissions, dependency pinning, secret handling,
        supply-chain risks, and deterministic CI.

    - path: "Dockerfile"
      instructions: |
        Check multi-stage build correctness, image size, runtime dependencies,
        non-root execution, secret exposure, package installation,
        and unnecessary tools in the production image.

    - path: "shared/**"
      instructions: |
        Treat this as shared infrastructure.
        Check Kafka producer and consumer behavior, event contracts,
        idempotency, error handling, logging, retry behavior,
        and backward compatibility across services.

    - path: "services/api-gateway/**"
      instructions: |
        Check route mappings, proxy configuration, authentication propagation,
        downstream failures, timeout handling, and accidental exposure of internal services.

chat:
  auto_reply: true
