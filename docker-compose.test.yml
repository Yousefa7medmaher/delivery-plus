        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      args:
        SERVICE_NAME: tracking-service
    restart: unless-stopped
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
